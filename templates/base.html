<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Acatech SMS{% endblock %}</title>
    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-dt@1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/components.css">
  </head>
  <body>
    {% include 'partials/_topbar.html' %}
    <div class="container-fluid">
      <div class="row">
        <aside class="col-md-2 d-none d-md-block sidebar-column">
          {% include 'partials/_sidebar.html' %}
        </aside>
        <section class="col-md-10 col-12 py-3">
          <main>
            {% block content %}{% endblock %}
          </main>
        </section>
      </div>
    </div>
    <footer class="mt-4">
      <div class="container">
        <small>© Acatech {{ now|date:"Y" }}</small>
      </div>
    </footer>

    <!-- JS libs: jQuery (for DataTables), Bootstrap, Chart.js, DataTables, HTMX -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.10.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@1.13.6/js/jquery.dataTables.min.js"></script>

    <!-- Vite-built assets (if you run npm build) -->
    <script type="module" src="/static/dist/main.js"></script>
    {% block extra_js %}{% endblock %}
    <script>
      // sidebar toggle for small screens
      document.addEventListener('DOMContentLoaded', function(){
        var toggler = document.getElementById('sidebarToggle');
        if(toggler){
          toggler.addEventListener('click', function(){
            var sb = document.getElementById('sidebar');
            if(sb) sb.classList.toggle('show');
          });
        }
      });
    </script>
  </body>
</html>
