{% extends 'layouts/base_dashboard.html' %}
{% block title %}Edit User — {{ user_obj.email }}{% endblock %}
{% block content %}
<h3>Edit User</h3>
<form method="post">{% csrf_token %}
  <div class="row">
    <div class="col-md-6 mb-3"><label>First name</label><input class="form-control" name="first_name" value="{{ user_obj.profile.first_name }}"></div>
    <div class="col-md-6 mb-3"><label>Last name</label><input class="form-control" name="last_name" value="{{ user_obj.profile.last_name }}"></div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3"><label>Email</label><input class="form-control" name="email" type="email" value="{{ user_obj.email }}"></div>
    <div class="col-md-6 mb-3"><label>Phone</label><input class="form-control" name="phone" value="{{ user_obj.phone }}"></div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3"><label>Username</label><input class="form-control" name="username" value="{{ user_obj.username }}"></div>
    <div class="col-md-6 mb-3"><label>Password (leave blank to keep)</label><input class="form-control" name="password" type="password"></div>
  </div>
  <div class="mb-3 form-check"><input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if user_obj.is_active %}checked{% endif %}><label class="form-check-label" for="is_active">Active</label></div>
  <div><button class="btn btn-primary">Save</button> <a class="btn btn-link" href="{% url 'admin_user_list' %}">Cancel</a></div>
</form>
{% endblock %}
