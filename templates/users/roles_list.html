{% extends 'layouts/base_dashboard.html' %}
{% block title %}Roles — Admin{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Roles</h3>
  <a class="btn btn-primary" href="{% url 'admin_role_create' %}">Create Role</a>
</div>
<div class="card p-3">
  <table class="table">
    <thead><tr><th>Name</th><th>Code</th><th>Actions</th></tr></thead>
    <tbody>
      {% for r in roles %}
      <tr><td>{{ r.name }}</td><td>{{ r.code }}</td><td>-</td></tr>
      {% empty %}
      <tr><td colspan="3" class="text-center">No roles</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
