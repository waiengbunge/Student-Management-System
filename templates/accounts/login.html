{% extends 'layouts/base_auth.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:60vh">
  <div class="card p-4" style="width:420px">
    <h4 class="mb-3 text-center">Sign in to Acatech SMS</h4>
    <form method="post" action="{% url 'login' %}">{% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <div><label class="form-check"><input type="checkbox" name="remember" class="form-check-input"> Remember me</label></div>
        <button class="btn btn-primary">Login</button>
      </div>
    </form>
    <div class="mt-3 text-center"><a href="/admin/password_reset/">Forgot password?</a></div>
  </div>
</div>
{% endblock %}
