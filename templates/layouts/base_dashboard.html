{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <div class="d-flex" id="layout-wrapper">
      {% include 'layouts/sidebar.html' %}

      <div class="flex-grow-1 min-vh-100 bg-light sidebar-visible">
        {% include 'layouts/navbar.html' %}

        <main class="container-fluid p-4">
          {% block content %}{% endblock %}
        </main>

        <footer class="bg-white border-top text-muted small p-3 text-center">
          &copy; {{ now.year }} Acatech SMS — All rights reserved.
        </footer>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
    (function(){
      function getCookie(name){
        let cookieValue = null;
        if (document.cookie && document.cookie !== ''){
          const cookies = document.cookie.split(';');
          for (let i=0;i<cookies.length;i++){
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length+1) === (name + '=')){
              cookieValue = decodeURIComponent(cookie.substring(name.length+1));
              break;
            }
          }
        }
        return cookieValue;
      }
      const csrftoken = getCookie('csrftoken');

      // jQuery ajax setup
      if (window.jQuery){
        try{ $.ajaxSetup({ beforeSend: function(xhr, settings){ if (!/^(GET|HEAD|OPTIONS|TRACE)$/.test(settings.type) && !this.crossDomain){ xhr.setRequestHeader('X-CSRFToken', csrftoken); } } }); }catch(e){}
      }

      // htmx support: set header for requests
      if (window.htmx){
        document.body.addEventListener('htmx:configRequest', function(evt){ evt.detail.headers['X-CSRFToken'] = csrftoken; });
      }

      // fetch wrapper to add CSRF token for non-safe methods
      const _fetch = window.fetch;
      window.fetch = function(resource, init){
        init = init || {};
        init.headers = init.headers || {};
        const method = (init.method || 'GET').toUpperCase();
        if (!/^(GET|HEAD|OPTIONS|TRACE)$/.test(method)){
          if (!init.headers['X-CSRFToken']) init.headers['X-CSRFToken'] = csrftoken;
        }
        return _fetch(resource, init);
      };
    })();
    </script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
