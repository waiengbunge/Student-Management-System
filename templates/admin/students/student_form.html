{% extends 'layouts/base_dashboard.html' %}
{% block title %}Student Form — Admin{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>{% if student %}Edit{% else %}Add{% endif %} Student</h3>
  <a class="btn btn-secondary" href="{% url 'admin_students_list' %}">Back</a>
</div>
<div class="card p-3">
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <div class="mt-2"><button class="btn btn-primary">Save</button></div>
  </form>
</div>
{% endblock %}
