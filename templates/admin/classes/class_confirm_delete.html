{% extends 'layouts/base_dashboard.html' %}
{% block title %}Delete Classroom{% endblock %}
{% block content %}
<div class="card p-4">
  <h4>Confirm delete</h4>
  <p>Are you sure you want to permanently delete classroom <strong>{{ classroom.name }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <a href="{% url 'admin_classes_list' %}" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-danger">Delete</button>
  </form>
</div>
{% endblock %}
