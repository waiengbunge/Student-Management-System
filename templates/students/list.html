{% extends "base.html" %}
{% block title %}Students — Acatech{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Students</h2>
  <div>
    <button class="btn btn-sm btn-primary" hx-get="{% url 'blueprint:students_add' %}" hx-target="#entityModalBody" data-bs-toggle="modal" data-bs-target="#entityModal">Add Student</button>
  </div>
</div>

<div class="card">
  <table id="studentTable" class="table table-striped" style="width:100%">
    <thead><tr><th>Student No</th><th>Name</th><th>Program</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<!-- Modal used by HTMX -->
<div class="modal fade" id="entityModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Entity</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="entityModalBody">
        <!-- HTMX loads form here -->
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
  $(document).ready(function(){
    $('#studentTable').DataTable({
      ajax: {
        url: '/api/v1/blueprint/server/students/',
        dataSrc: 'results'
      },
      columns: [
        { data: 'student_number', render: function(data,type,row){ return `<a href="/students/${row.id}/">${data}</a>` } },
        { data: null, render: function(data,type,row){ return row.first_name + ' ' + row.last_name } },
        { data: 'program_name' },
        { data: 'status' }
      ],
      processing: true,
      serverSide: false,
      pageLength: 25
    });
  });
</script>
{% endblock %}
