{% load static %}
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
  <div class="container-fluid px-3">
    <button class="btn btn-sm btn-outline-secondary d-none d-md-inline" id="sidebarToggle"><i class="bi bi-list"></i></button>

    <form class="d-flex ms-3 w-50" role="search">
      <input class="form-control me-2" type="search" placeholder="Search students, courses, invoices..." aria-label="Search">
      <button class="btn btn-outline-primary" type="submit"><i class="bi bi-search"></i></button>
    </form>

    <ul class="navbar-nav ms-auto align-items-center">
      <li class="nav-item dropdown me-3">
        <a class="nav-link position-relative" href="#" id="notificationsDropdown" role="button" data-bs-toggle="dropdown"><i class="bi bi-bell fs-5"></i><span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">3</span></a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="notificationsDropdown" style="width:320px">
          <li class="dropdown-header">Notifications</li>
          <li><hr class="dropdown-divider"></li>
          <li class="px-3"><small class="text-muted">You have 3 new notifications</small></li>
        </ul>
      </li>

      {% if user.is_authenticated %}
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"> <img src="{% static 'img/avatar-placeholder.png' %}" width="32" class="rounded-circle me-1"> {{ user.get_full_name|default:user.username }}</a>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="/profile/">Profile</a></li>
          <li><a class="dropdown-item" href="/settings/">Settings</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="{% url 'logout' %}">Logout</a></li>
        </ul>
      </li>
      {% else %}
      <li class="nav-item me-2"><a class="nav-link btn btn-outline-primary btn-sm" href="{% url 'login' %}?next={{ request.path|urlencode }}">Login</a></li>
      {% endif %}
    </ul>
  </div>
</nav>
